[settings]
color_theme = "base16"
experimental = true
dotfiles.root = "~/github/dotfiles"
dotfiles.default_mode = "symlink"
minimum_release_age = "0s"
auto_update = true

[dotfiles]
"~/.zshrc" = {}
"~/.hushlogin" = {}
"~/.config/*" = {}

[tools]
clojure = "latest"
babashka = "latest"
"github:clojure-lsp/clojure-lsp" = { version = "latest", matching = "native" }
java = "temurin-25"
node = "24"
