[settings]
color_theme = "base16"
experimental = true
dotfiles.root = "~/github/dotfiles"
dotfiles.default_mode = "symlink"
minimum_release_age = "0s"
auto_update = true

[dotfiles]
"~/.zshrc" = {}
"~/.hushlogin" = {}
"~/.config/*" = {}
"~/Library/Application Support/typst/packages" = { source = "../typst/packages" }

[tools]
"github:OleksandrChekhovskyi/hax" = "latest"
neovim = "nightly"
