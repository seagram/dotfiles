#:schema https://yazi-rs.github.io/schemas/theme.json

[app]
overall = {}

[mgr]
cwd = { fg = "white", bold = true }

find_keyword  = { fg = "white", bold = true, underline = true }
find_position = { fg = "gray", bg = "reset", bold = true }

symlink_target = { fg = "gray", italic = true }

marker_copied   = { fg = "white", bg = "white" }
marker_cut      = { fg = "gray", bg = "gray" }
marker_marked   = { fg = "white", bg = "white" }
marker_selected = { fg = "gray", bg = "gray" }
marker_symbol   = "│"

count_copied   = { fg = "black", bg = "white" }
count_cut      = { fg = "black", bg = "gray" }
count_selected = { fg = "black", bg = "white" }

border_symbol = "│"
border_style  = { fg = "gray" }

[tabs]
active   = { fg = "black", bg = "white", bold = true }
inactive = { fg = "gray", bg = "black" }
sep_inner = { open = "[", close = "]" }
sep_outer = { open = "[", close = "]" }

[mode]
normal_main = { fg = "black", bg = "white", bold = true }
normal_alt  = { fg = "white", bg = "darkgray" }

select_main = { fg = "black", bg = "white", bold = true }
select_alt  = { fg = "white", bg = "darkgray" }

unset_main = { fg = "black", bg = "gray", bold = true }
unset_alt  = { fg = "gray", bg = "black" }

[indicator]
parent  = { reversed = true }
current = { reversed = true }
preview = { underline = true }
padding = { open = "▐", close = "▌" }

[status]
overall   = {}
sep_left  = { open = "", close = "▌" }
sep_right = { open = "▐", close = "" }

perm_sep   = { fg = "darkgray" }
perm_type  = { fg = "gray" }
perm_read  = { fg = "white" }
perm_write = { fg = "gray" }
perm_exec  = { fg = "white" }

progress_label  = { fg = "white", bold = true }
progress_normal = { fg = "white", bg = "black" }
progress_error  = { fg = "black", bg = "white" }

[which]
cols            = 3
mask            = { bg = "black" }
cand            = { fg = "white", bold = true }
rest            = { fg = "gray" }
desc            = { fg = "gray" }
separator       = " -> "
separator_style = { fg = "darkgray" }

[confirm]
border     = { fg = "gray" }
title      = { fg = "white", bold = true }
body       = { fg = "white" }
list       = { fg = "gray" }
btn_yes    = { reversed = true, bold = true }
btn_no     = { fg = "gray" }
btn_labels = [ "  [Y]es  ", "  [N]o  " ]

[spot]
border   = { fg = "gray" }
title    = { fg = "white", bold = true }
tbl_col  = { fg = "white", bold = true }
tbl_cell = { reversed = true }

[notify]
title_info  = { fg = "white", bold = true }
title_warn  = { fg = "white", bold = true }
title_error = { fg = "white", bold = true }
icon_info   = "i"
icon_warn   = "!"
icon_error  = "x"

[pick]
border   = { fg = "gray" }
active   = { fg = "white", reversed = true, bold = true }
inactive = { fg = "gray" }

[input]
border   = { fg = "gray" }
title    = { fg = "white", bold = true }
value    = { fg = "white" }
selected = { reversed = true }

[cmp]
border       = { fg = "gray" }
active       = { reversed = true, bold = true }
inactive     = { fg = "gray" }
icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "gray" }
title   = { fg = "white", bold = true }
hovered = { reversed = true, bold = true }

[help]
border  = { fg = "gray" }
chord   = { fg = "white", bold = true }
action  = { fg = "gray" }
hovered = { reversed = true, bold = true }

[filetype]
rules = [
	{ url = "*",  fg = "gray" },
	{ url = "*/", fg = "white", bold = true },
]

[icon]
globs = []
dirs  = []
files = []
exts  = []
conds = [
	{ if = "orphan",        text = "", fg = "gray" },
	{ if = "link & dir",    text = "", fg = "gray" },
	{ if = "link",          text = "", fg = "gray" },
	{ if = "dir",           text = "", fg = "gray" },
	{ if = "exec",          text = "", fg = "gray" },
	{ if = "!(dir | link)", text = "", fg = "gray" },
]
