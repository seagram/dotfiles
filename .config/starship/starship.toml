add_newline = false
format = """$character"""
right_format = """$directory$all"""
command_timeout = 1000

[character]
success_symbol = 'λ'
error_symbol = 'λ'

[git_branch]
format = '[$branch]($style) '
style = 'bold dimmed white'

[git_status]
format = '[$all_status$ahead_behind]($style) '
style = 'bold dimmed white'
conflicted = 'U'
up_to_date = ''
untracked = '?'
ahead = '+${count}'
diverged = '+${ahead_count}-${behind_count}'
behind = '-${count}'
stashed = '\$'
modified = 'M'
staged = 'S${count}'
renamed = 'R'
deleted = 'D'

[custom.clojure]
detect_extensions = ['clj', 'cljs', 'cljc']
symbol = ' '
format = '[${symbol}clojure]($style)'
style = 'bold dimmed white'

[mise]
disabled = false
format = 'mise '

[docker_context]
format = '[$symbol$context ✓]($style) '
only_with_files = false
symbol = " "
style = "bold dimmed white"

[hostname]
disabled = false
ssh_only = true
format = 'on [$hostname]($style)'
ssh_symbol = " "
style = "bold dimmed white"

[rust]
format = '[rust ($version )]($style)'
style = "bold dimmed white"

[bun]
format = '[bun ($version )]($style)'
style = "bold dimmed white"

[python]
disabled = true
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
symbol = " "
pyenv_version_name = false
style = 'bold dimmed white'

[terraform]
format = '[󱁢 $workspace]($style) '

[nodejs]
format = '[$symbol($version )]($style)'
style = 'bold dimmed white'

[cmd_duration]
disabled = true

[typst]
disabled = true

[package]
disabled = true

[lua]
disabled = true

[java]
disabled = true
